<!doctype html>
<!--
  #PAGINA_MI_CUENTA  #MI_CUENTA  #CAMBIAR_CONTRASENA
  MI CUENTA (cualquier usuario con sesión)
  Muestra el perfil y permite cambiar el nombre, el correo y la contraseña.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta - Hospedajes Antigua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3">Mi cuenta</h1>
    <div id="mensaje"></div>

    <div class="row g-4">
      <!-- Tarjeta del perfil -->
      <div class="col-lg-4">
        <div class="card card-body shadow-sm text-center" id="perfil">
          <div class="text-muted">Cargando...</div>
        </div>
      </div>

      <div class="col-lg-8">
        <!-- Cambiar nombre y correo -->
        <div class="card card-body shadow-sm mb-4">
          <h2 class="h6 text-muted mb-3">Mis datos</h2>
          <form id="formDatos" class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="nombre">Nombre</label>
              <input class="form-control" id="nombre" required maxlength="100">
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="correo">Correo</label>
              <input class="form-control" id="correo" type="email" maxlength="120">
              <div class="form-text">También puedes iniciar sesión con tu correo.</div>
            </div>
            <div class="col-12 text-end"><button class="btn btn-primary">Guardar datos</button></div>
          </form>
        </div>

        <!-- Cambiar contraseña -->
        <div class="card card-body shadow-sm">
          <h2 class="h6 text-muted mb-3">Cambiar contraseña</h2>
          <form id="formPassword" class="row g-3">
            <div class="col-12">
              <label class="form-label" for="actual">Contraseña actual</label>
              <input class="form-control" id="actual" type="password" required autocomplete="current-password">
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="nueva">Nueva contraseña</label>
              <input class="form-control" id="nueva" type="password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="confirmar">Confirmar nueva contraseña</label>
              <input class="form-control" id="confirmar" type="password" required autocomplete="new-password">
            </div>
            <div class="col-12 text-end"><button class="btn btn-primary">Cambiar contraseña</button></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small">Proyecto Programación 2 · Grupo 4 · Hoteles y hospedajes</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/idioma.js"></script>
  <script src="js/comun.js"></script>
  <script>
    const usuario = exigirSesion();
    pintarMenu('');
    const mensaje = document.getElementById('mensaje');

    // Pide mis datos a la API y llena la tarjeta del perfil y el formulario
    async function cargarPerfil() {
      const yo = await api('/auth/yo');

      document.getElementById('nombre').value = yo.nombre;
      document.getElementById('correo').value = yo.correo || '';

      const inicial = yo.nombre.trim().charAt(0).toUpperCase();
      // La fecha sale en el idioma de la página (#IDIOMA)
      const formatoFecha = document.documentElement.lang === 'en' ? 'en-US' : 'es-GT';
      const fecha = new Date(yo.creado_en).toLocaleDateString(formatoFecha, { year: 'numeric', month: 'long', day: 'numeric' });

      let colorRol = 'secondary';
      if (yo.rol === 'admin') colorRol = 'danger';
      if (yo.rol === 'registrador') colorRol = 'primary';

      // Los registros solo se muestran a admin y registradores
      let registros = '';
      if (esEditor(yo)) {
        registros = `<div class="col"><div class="fs-4 fw-bold">${yo.registros}</div><a class="small" href="mis-registros.html">Registrados</a></div>`;
      }

      document.getElementById('perfil').innerHTML = `
        <span class="avatar avatar-grande mx-auto mb-3">${esc(inicial)}</span>
        <h2 class="h5 mb-0">${esc(yo.nombre)}</h2>
        <p class="text-muted mb-2">@${esc(yo.usuario)}</p>
        <div><span class="badge rounded-pill text-bg-${colorRol}">${NOMBRE_ROL[yo.rol]}</span></div>
        <hr>
        <div class="row text-center">
          <div class="col"><div class="fs-4 fw-bold">${yo.favoritos}</div><a class="small" href="favoritos.html">Favoritos</a></div>
          ${registros}
        </div>
        <p class="small text-muted mt-3 mb-0">Miembro desde el ${fecha}</p>`;
    }

    // Guardar nombre y correo
    document.getElementById('formDatos').addEventListener('submit', async function (evento) {
      evento.preventDefault();
      const datos = {
        nombre: document.getElementById('nombre').value,
        correo: document.getElementById('correo').value,
      };
      try {
        const respuesta = await api('/auth/yo', { method: 'PUT', body: datos });
        guardarSesion(respuesta.token, respuesta.usuario);   // el nombre cambió
        pintarMenu('');
        await cargarPerfil();
        alerta(mensaje, 'Datos guardados.', 'success');
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
    });

    // Cambiar contraseña
    document.getElementById('formPassword').addEventListener('submit', async function (evento) {
      evento.preventDefault();
      const nueva = document.getElementById('nueva').value;
      const confirmar = document.getElementById('confirmar').value;

      if (nueva !== confirmar) {
        alerta(mensaje, 'Las contraseñas nuevas no coinciden.', 'warning');
        return;
      }

      try {
        await api('/auth/password', {
          method: 'PUT',
          body: { actual: document.getElementById('actual').value, nueva: nueva },
        });
        document.getElementById('formPassword').reset();
        alerta(mensaje, 'Contraseña cambiada. Úsala la próxima vez que inicies sesión.', 'success');
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
      window.scrollTo(0, 0);
    });

    if (usuario) {
      cargarPerfil().catch(function (error) {
        alerta(mensaje, esc(error.message));
      });
    }
  </script>
</body>
</html>
