<!doctype html>
<!--
  #PAGINA_FAVORITOS  #FAVORITOS
  MIS FAVORITOS (cualquier usuario con sesión)
  Muestra los hospedajes que el usuario guardó con el corazón ❤.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis favoritos - Hospedajes Antigua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-1"><i class="bi bi-heart-fill text-danger"></i> Mis favoritos</h1>
    <p class="text-muted small" id="contador"></p>
    <div class="row g-3" id="resultados"><div class="text-muted">Cargando...</div></div>
  </main>

  <footer class="py-3 text-center small">Proyecto Programación 2 · Grupo 4 · Hoteles y hospedajes</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/idioma.js"></script>
  <script src="js/comun.js"></script>
  <script>
    const usuario = exigirSesion();
    pintarMenu('favoritos');

    // Pide mis favoritos y dibuja las tarjetas
    async function cargar() {
      const lista = await api('/favoritos');
      const servicios = await cargarServicios();
      await cargarFavoritos();

      const contenedor = document.getElementById('resultados');

      if (lista.length === 0) {
        document.getElementById('contador').textContent = '';
        contenedor.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-heart display-4 text-muted"></i>
            <p class="mt-3 mb-1">Todavía no tienes hospedajes guardados.</p>
            <p class="text-muted small">Toca el corazón de cualquier hospedaje del catálogo para guardarlo aquí.</p>
            <a class="btn btn-primary" href="hospedajes.html">Ver catálogo</a>
          </div>`;
        return;
      }

      let texto = lista.length + ' hospedajes guardados';
      if (lista.length === 1) texto = '1 hospedaje guardado';
      document.getElementById('contador').textContent = texto;

      let html = '';
      for (const h of lista) {
        html += tarjetaHospedaje(h, servicios);
      }
      contenedor.innerHTML = html;
    }

    // comun.js llama a esta función cuando se quita un corazón:
    // volvemos a cargar la lista para que desaparezca la tarjeta
    function alQuitarFavorito(id) {
      cargar();
    }

    if (usuario) {
      cargar().catch(function (error) {
        alerta(document.getElementById('resultados'), esc(error.message));
      });
    }
  </script>
</body>
</html>
