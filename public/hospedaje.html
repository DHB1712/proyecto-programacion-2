<!doctype html>
<!--
  #PAGINA_DETALLE
  DETALLE DE UN HOSPEDAJE   (hospedaje.html?id=5)
  Muestra toda la información de un hospedaje: foto, descripción,
  servicios, contacto, coordenadas y el mapa de Google Maps.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del hospedaje - Hospedajes Antigua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <!-- Todo el contenido se dibuja con JavaScript cuando llegan los datos -->
  <main class="container py-4" id="contenido">
    <div class="text-muted">Cargando...</div>
  </main>

  <footer class="py-3 text-center small">Proyecto Programación 2 · Grupo 4 · Hoteles y hospedajes</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script>
    pintarMenu('hospedajes');

    // Devuelve un dato con su título, o nada si el dato está vacío
    function dato(titulo, valor) {
      if (!valor) {
        return '';
      }
      return `<dt>${titulo}</dt><dd>${valor}</dd>`;
    }

    async function cargarDetalle() {
      const id = parametro('id');
      const h = await api('/hospedajes/' + id);
      const servicios = await cargarServicios();
      await cargarFavoritos();

      document.title = h.nombre + ' - Hospedajes Antigua';

      // ----- Botones de arriba -----
      let botones = '';
      // El corazón solo para hospedajes publicados
      if (h.estado === 'activo' && h.revision === 'aprobado') {
        botones += botonFavorito(h.id, true);
      }
      if (puedeModificar(h)) {
        botones += `<a class="btn btn-outline-secondary" href="registro.html?id=${h.id}"><i class="bi bi-pencil"></i> Editar</a>`;
        botones += `<button class="btn btn-outline-danger" onclick="eliminar()"><i class="bi bi-trash"></i> Eliminar</button>`;
      }
      // #GOOGLE_MAPS  #COMO_LLEGAR - Abre la página del hotel en Google Maps (fotos, opiniones, horario)
      botones += `<a class="btn btn-outline-primary" href="${paginaGoogleMaps(h)}" target="_blank"><i class="bi bi-google"></i> Fotos y opiniones en Google Maps</a>`;
      botones += `<a class="btn btn-primary" href="${urlComoLlegar(h.latitud, h.longitud)}" target="_blank"><i class="bi bi-sign-turn-right"></i> Cómo llegar</a>`;

      // ----- Etiquetas junto al nombre -----
      let etiquetas = `<span class="badge text-bg-light border"><i class="bi ${esc(h.icono)}"></i> ${esc(h.tipo)}</span> `;
      if (h.precio_desde !== null) {
        etiquetas += `<span class="badge text-bg-light border">Desde ${precio(h.precio_desde)} por noche</span> `;
      }
      if (h.estado === 'inactivo') {
        etiquetas += '<span class="badge text-bg-secondary">Inactivo</span> ';
      }
      if (h.revision !== 'aprobado') {
        etiquetas += etiquetaRevision(h.revision);
      }

      // ----- Avisos -----
      let avisos = '';
      if (h.revision === 'rechazado' && h.observacion) {
        avisos += `<div class="alert alert-warning"><b>Observación del administrador:</b> ${esc(h.observacion)}</div>`;
      }
      if (h.es_ejemplo) {
        avisos += `
          <div class="alert alert-light border small">
            <i class="bi bi-info-circle text-warning"></i>
            <b>Información de ejemplo.</b> La ubicación es aproximada y el precio y los servicios
            aún no han sido verificados. Revisa la información real en Google Maps.
          </div>`;
      }

      // ----- Foto -----
      let foto = '';
      if (h.foto_url) {
        foto = `
          <figure class="mb-3">
            <img src="${esc(h.foto_url)}" class="foto-detalle shadow-sm" alt="${esc(h.nombre)}" onerror="this.parentElement.remove()">
          </figure>`;
      }

      // ----- Lista de servicios -----
      let listaServicios = '';
      for (const s of servicios) {
        if (h.servicios.includes(s.clave)) {
          listaServicios += `<li class="col small"><i class="bi ${s.icono} servicio"></i>${s.nombre}</li>`;
        }
      }
      if (listaServicios !== '') {
        listaServicios = `<h2 class="h6">Servicios</h2><ul class="list-unstyled row row-cols-2 g-1 mb-3">${listaServicios}</ul>`;
      }

      // ----- Datos de contacto -----
      const coordenadas = h.latitud.toFixed(6) + ', ' + h.longitud.toFixed(6);
      let telefono = '';
      if (h.telefono) telefono = `<a href="tel:${esc(h.telefono)}">${esc(h.telefono)}</a>`;
      let correo = '';
      if (h.correo) correo = `<a href="mailto:${esc(h.correo)}">${esc(h.correo)}</a>`;
      let sitioWeb = '';
      if (h.sitio_web) sitioWeb = `<a href="${esc(h.sitio_web)}" target="_blank">${esc(h.sitio_web)}</a>`;

      // ----- Juntamos todo -----
      document.getElementById('contenido').innerHTML = `
        <nav><ol class="breadcrumb small">
          <li class="breadcrumb-item"><a href="hospedajes.html">Catálogo</a></li>
          <li class="breadcrumb-item"><a href="hospedajes.html?tipo=${esc(h.tipo_slug)}">${esc(h.tipo)}</a></li>
          <li class="breadcrumb-item active">${esc(h.nombre)}</li>
        </ol></nav>

        <h1 class="h3 mb-1">${esc(h.nombre)}</h1>
        <div class="mb-3">${etiquetas}</div>
        <div class="d-flex flex-wrap gap-2 mb-3">${botones}</div>
        ${avisos}

        <div class="row g-4">
          <div class="col-lg-7">
            ${foto}
            <p>${esc(h.descripcion)}</p>
            ${listaServicios}
            <!-- #MAPA - Mapa de Google Maps dentro de la página (versión gratis, sin API) -->
            <iframe class="mapa shadow-sm" loading="lazy" title="Mapa"
              src="https://maps.google.com/maps?q=${h.latitud},${h.longitud}&z=17&output=embed"></iframe>
          </div>
          <div class="col-lg-5">
            <div class="card card-body shadow-sm">
              <dl class="dato mb-0">
                ${dato('Código', esc(h.codigo))}
                ${dato('Dirección o referencia', esc(h.direccion))}
                ${dato('Municipio y departamento', esc(h.municipio) + ', ' + esc(h.departamento))}
                ${dato('Coordenadas (latitud, longitud)', `<code>${coordenadas}</code>
                    <button class="btn btn-link btn-sm p-0 ms-2" title="Copiar" onclick="copiar(this, '${coordenadas}')"><i class="bi bi-clipboard"></i></button>`)}
                ${dato('Teléfono', telefono)}
                ${dato('Correo', correo)}
                ${dato('Sitio web', sitioWeb)}
                ${dato('Redes sociales u otros contactos', esc(h.contacto))}
                ${dato('Registrado por', esc(h.creado_por))}
              </dl>
            </div>
          </div>
        </div>`;
    }

    // Copia las coordenadas al portapapeles
    function copiar(boton, texto) {
      navigator.clipboard.writeText(texto);
      boton.innerHTML = '<i class="bi bi-check2"></i>';
    }

    // Botón Eliminar: si se elimina, volvemos al catálogo
    async function eliminar() {
      const titulo = document.querySelector('h1').textContent;
      try {
        const eliminado = await eliminarHospedaje(parametro('id'), titulo);
        if (eliminado) {
          location.href = 'hospedajes.html';
        }
      } catch (error) {
        alert(error.message);
      }
    }

    cargarDetalle().catch(function (error) {
      document.getElementById('contenido').innerHTML =
        `<div class="alert alert-warning">${esc(error.message)} <a href="hospedajes.html">Volver al catálogo</a></div>`;
    });
  </script>
</body>
</html>
