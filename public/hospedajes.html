<!doctype html>
<!--
  #PAGINA_CATALOGO
  CATÁLOGO DE HOSPEDAJES
  Muestra los hospedajes con filtros (nombre, tipo, lugar, precio y servicios).
  Cada vez que se cambia un filtro, se piden los datos otra vez a la API.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de hospedajes - Hospedajes Antigua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4 encabezado-pagina">
      <div>
        <h1 class="h2">Hoteles y hospedajes</h1>
        <p class="text-muted mb-0">Encuentra dónde quedarte en Antigua Guatemala.</p>
      </div>
      <!-- Este botón solo se muestra al admin y a los registradores -->
      <a class="btn btn-primary d-none" href="registro.html" id="btnNuevo"><i class="bi bi-plus-lg"></i> Agregar hospedaje</a>
    </div>

    <!-- Filtros de búsqueda: arriba los principales, el resto en "Más filtros" -->
    <form id="filtros" class="card card-body shadow-sm mb-4 p-3">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-lg">
          <label class="visually-hidden" for="q">Buscar</label>
          <div class="campo-icono">
            <i class="bi bi-search"></i>
            <input class="form-control" id="q" placeholder="Buscar por nombre, dirección o descripción">
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <label class="visually-hidden" for="tipo">Tipo</label>
          <select class="form-select" id="tipo"><option value="">Todos los tipos</option></select>
        </div>
        <div class="col-6 col-lg-2">
          <label class="visually-hidden" for="precio_max">Precio máximo (Q)</label>
          <input class="form-control" id="precio_max" type="number" min="0" step="50" placeholder="Precio máx. (Q)">
        </div>
        <div class="col-12 col-lg-auto">
          <button type="button" class="btn btn-outline-secondary w-100" data-bs-toggle="collapse" data-bs-target="#masFiltros" aria-expanded="false" aria-controls="masFiltros">
            <i class="bi bi-sliders"></i> Más filtros<span class="contador-filtros d-none" id="contadorFiltros"></span>
          </button>
        </div>
      </div>

      <!-- Filtros extra: departamento, municipio y servicios -->
      <div class="collapse" id="masFiltros">
        <hr class="my-3">
        <div class="row g-2">
          <div class="col-6 col-lg-3">
            <label class="form-label small" for="departamento">Departamento</label>
            <select class="form-select" id="departamento"><option value="">Todos</option></select>
          </div>
          <div class="col-6 col-lg-3">
            <label class="form-label small" for="municipio">Municipio</label>
            <select class="form-select" id="municipio"><option value="">Todos</option></select>
          </div>
        </div>
        <div class="mt-3">
          <span class="form-label small d-block">Servicios</span>
          <div id="servicios" class="fichas"></div>
        </div>
        <div class="d-flex justify-content-end mt-3">
          <button type="button" id="btnLimpiar" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> Limpiar filtros</button>
        </div>
      </div>
    </form>

    <!-- Contador, orden y botones para cambiar entre lista y mapa -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <p class="fw-semibold mb-0" id="contador"></p>
      <div class="d-flex align-items-center gap-2">
        <label class="visually-hidden" for="orden">Ordenar por</label>
        <select class="form-select form-select-sm w-auto" id="orden" form="filtros">
          <option value="">Ordenar: nombre</option>
          <option value="precio">Ordenar: precio más bajo</option>
        </select>
        <div class="segmentado" role="group" aria-label="Forma de ver los resultados">
          <input type="radio" class="btn-check" name="vista" id="vistaLista" value="lista" checked>
          <label class="btn btn-sm" for="vistaLista"><i class="bi bi-grid"></i> Lista</label>
          <input type="radio" class="btn-check" name="vista" id="vistaMapa" value="mapa">
          <label class="btn btn-sm" for="vistaMapa"><i class="bi bi-map"></i> Mapa</label>
        </div>
      </div>
    </div>

    <!-- Vista de lista: aquí se dibujan las tarjetas de los hospedajes -->
    <div class="row g-3" id="resultados"></div>

    <!-- #MAPA_GENERAL - Vista de mapa: todos los hospedajes en OpenStreetMap con su directorio al lado -->
    <div class="row g-3 d-none" id="cajaMapa">
      <div class="col-lg-8">
        <div id="mapaGeneral" class="mapa mapa-grande shadow-sm"></div>
      </div>
      <div class="col-lg-4">
        <div class="list-group directorio shadow-sm" id="directorio"></div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small">Proyecto Programación 2 · Grupo 4 · Hoteles y hospedajes</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/idioma.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/mapa.js"></script>
  <script>
    pintarMenu('hospedajes');

    let servicios = [];     // lista de servicios (wifi, parqueo...)
    let ubicaciones = [];   // departamentos y municipios que tienen hospedajes
    let encontrados = [];   // hospedajes de la última búsqueda (para el mapa)

    // ----- Mapa general -----   #MAPA_GENERAL
    let mapa = null;          // se crea la primera vez que se abre la vista de mapa
    let capaMarcadores = null;
    let marcadores = {};      // id del hospedaje -> su marcador

    function vistaElegida() {
      return document.querySelector('input[name="vista"]:checked').value;
    }

    // Pone un marcador por hospedaje y llena el directorio de al lado
    function dibujarMapa() {
      if (vistaElegida() !== 'mapa') {
        return;
      }
      if (mapa === null) {
        mapa = crearMapa('mapaGeneral', 15);
        capaMarcadores = L.layerGroup().addTo(mapa);
      }
      mapa.invalidateSize();   // por si el mapa estaba escondido al crearlo

      capaMarcadores.clearLayers();
      marcadores = {};
      let directorio = '';
      const puntos = [];

      for (const h of encontrados) {
        const marcador = L.marker([h.latitud, h.longitud], { icon: iconoMarcador(h.icono), title: h.nombre })
          .bindPopup(ventanaMarcador(h))
          .addTo(capaMarcadores);
        marcadores[h.id] = marcador;
        puntos.push([h.latitud, h.longitud]);

        let textoPrecio = '';
        if (h.precio_desde !== null) {
          textoPrecio = `<span class="small fw-semibold text-nowrap">desde ${precio(h.precio_desde)}</span>`;
        }
        directorio += `
          <button type="button" class="list-group-item list-group-item-action" onclick="mostrarEnMapa(${h.id})">
            <div class="d-flex justify-content-between gap-2">
              <span class="fw-semibold">${esc(h.nombre)}</span>
              ${textoPrecio}
            </div>
            <div class="small text-muted"><i class="bi ${esc(h.icono)}"></i> <span>${esc(h.tipo)}</span> · ${esc(h.direccion || h.municipio)}</div>
          </button>`;
      }

      if (encontrados.length === 0) {
        directorio = '<div class="list-group-item text-muted small">No se encontraron hospedajes con esos filtros.</div>';
      }
      document.getElementById('directorio').innerHTML = directorio;

      // Acercamos el mapa para que se vean todos los marcadores
      if (puntos.length > 0) {
        mapa.fitBounds(puntos, { padding: [40, 40], maxZoom: 17 });
      }
    }

    // Al tocar un hospedaje del directorio: lo centramos y abrimos su ventanita
    function mostrarEnMapa(id) {
      const marcador = marcadores[id];
      if (!marcador) {
        return;
      }
      mapa.setView(marcador.getLatLng(), 17);
      marcador.openPopup();
    }

    // Muestra la lista de tarjetas o el mapa
    function cambiarVista() {
      const enMapa = vistaElegida() === 'mapa';
      document.getElementById('resultados').classList.toggle('d-none', enMapa);
      document.getElementById('cajaMapa').classList.toggle('d-none', !enMapa);
      guardarDireccion();
      dibujarMapa();
    }

    // Guardamos los filtros y la vista en la dirección de la página (para poder compartirla)
    let filtrosActuales = '';
    function guardarDireccion() {
      const direccion = new URLSearchParams(filtrosActuales);
      if (vistaElegida() === 'mapa') {
        direccion.set('vista', 'mapa');
      }
      history.replaceState(null, '', '?' + direccion.toString());
    }

    for (const opcion of document.querySelectorAll('input[name="vista"]')) {
      opcion.addEventListener('change', cambiarVista);
    }

    // Mostrar el botón "Agregar hospedaje" a quien tenga el permiso de registrar
    if (tienePermiso(usuarioActual(), 'registrar')) {
      document.getElementById('btnNuevo').classList.remove('d-none');
    }

    // Llena la lista de municipios según el departamento elegido
    function llenarMunicipios() {
      const departamento = document.getElementById('departamento').value;
      const selectMunicipio = document.getElementById('municipio');
      const elegido = selectMunicipio.value;

      let opciones = '<option value="">Todos</option>';
      const yaAgregados = [];
      for (const u of ubicaciones) {
        if ((departamento === '' || u.departamento === departamento) && !yaAgregados.includes(u.municipio)) {
          yaAgregados.push(u.municipio);
          opciones += `<option>${esc(u.municipio)}</option>`;
        }
      }
      selectMunicipio.innerHTML = opciones;
      selectMunicipio.value = elegido;
    }

    // #FILTROS  #CATALOGO - Busca los hospedajes con los filtros y dibuja las tarjetas
    async function buscar() {
      // Armamos la dirección con los filtros, ej: /hospedajes?tipo=hostal&precio_max=200
      const filtros = new URLSearchParams();
      for (const campo of ['q', 'tipo', 'departamento', 'municipio', 'precio_max', 'orden']) {
        const valor = document.getElementById(campo).value;
        if (valor !== '') {
          filtros.set(campo, valor);
        }
      }

      // Servicios marcados, separados por coma: wifi,parqueo
      const marcados = [];
      for (const casilla of document.querySelectorAll('input[name="servicio"]:checked')) {
        marcados.push(casilla.value);
      }
      if (marcados.length > 0) {
        filtros.set('servicios', marcados.join(','));
      }

      // Cuántos filtros de "Más filtros" están puestos (se muestra en el botón)
      let extra = marcados.length;
      if (filtros.has('departamento')) extra++;
      if (filtros.has('municipio')) extra++;
      const contadorFiltros = document.getElementById('contadorFiltros');
      contadorFiltros.textContent = extra;
      contadorFiltros.classList.toggle('d-none', extra === 0);

      filtrosActuales = filtros.toString();
      guardarDireccion();

      const contenedor = document.getElementById('resultados');
      try {
        const hospedajes = await api('/hospedajes?' + filtros.toString());

        let texto = hospedajes.length + ' hospedajes encontrados';
        if (hospedajes.length === 1) texto = '1 hospedaje encontrado';
        document.getElementById('contador').textContent = texto;

        encontrados = hospedajes;
        dibujarMapa();

        if (hospedajes.length === 0) {
          contenedor.innerHTML = '<div class="col-12"><div class="alert alert-light border">No se encontraron hospedajes con esos filtros.</div></div>';
          return;
        }

        let html = '';
        for (const h of hospedajes) {
          html += tarjetaHospedaje(h, servicios);
        }
        contenedor.innerHTML = html;
      } catch (error) {
        contenedor.innerHTML = `<div class="col-12"><div class="alert alert-danger">${esc(error.message)}</div></div>`;
      }
    }

    // Se ejecuta al abrir la página: llena los filtros y hace la primera búsqueda
    async function iniciar() {
      const tipos = await api('/tipos');
      ubicaciones = await api('/hospedajes/filtros');
      servicios = await cargarServicios();
      await cargarFavoritos();

      // Lista de tipos
      for (const t of tipos) {
        document.getElementById('tipo').innerHTML += `<option value="${esc(t.slug)}">${esc(t.nombre)}</option>`;
      }

      // Lista de departamentos (sin repetir)
      const departamentos = [];
      for (const u of ubicaciones) {
        if (!departamentos.includes(u.departamento)) {
          departamentos.push(u.departamento);
          document.getElementById('departamento').innerHTML += `<option>${esc(u.departamento)}</option>`;
        }
      }

      // Botones de servicios (casillas con forma de botón)
      const serviciosEnUrl = (parametro('servicios') || '').split(',');
      let html = '';
      for (const s of servicios) {
        const marcado = serviciosEnUrl.includes(s.clave) ? 'checked' : '';
        html += `
          <input type="checkbox" class="btn-check" name="servicio" value="${s.clave}" id="s-${s.clave}" ${marcado}>
          <label class="btn btn-outline-secondary btn-sm" for="s-${s.clave}"><i class="bi ${s.icono}"></i> ${s.nombre}</label>`;
      }
      document.getElementById('servicios').innerHTML = html;

      // Si la dirección ya trae filtros (ej: desde la página de inicio), los ponemos
      for (const campo of ['q', 'tipo', 'departamento', 'precio_max', 'orden']) {
        if (parametro(campo)) {
          document.getElementById(campo).value = parametro(campo);
        }
      }
      llenarMunicipios();
      if (parametro('municipio')) {
        document.getElementById('municipio').value = parametro('municipio');
      }

      // Si la dirección trae filtros extra, abrimos "Más filtros" para que se vean
      if (parametro('departamento') || parametro('municipio') || parametro('servicios')) {
        document.getElementById('masFiltros').classList.add('show');
      }

      // hospedajes.html?vista=mapa abre directo el mapa
      if (parametro('vista') === 'mapa') {
        document.getElementById('vistaMapa').checked = true;
        document.getElementById('resultados').classList.add('d-none');
        document.getElementById('cajaMapa').classList.remove('d-none');
      }

      buscar();
    }

    // Cada vez que se cambia algo en los filtros, buscamos de nuevo.
    // (Esperamos 300 ms para no buscar con cada letra que se escribe.)
    let espera;
    document.getElementById('filtros').addEventListener('input', function (evento) {
      if (evento.target.id === 'departamento') {
        llenarMunicipios();
      }
      clearTimeout(espera);
      espera = setTimeout(buscar, 300);
    });

    // "Ordenar" está fuera del formulario (junto a Lista | Mapa): lo escuchamos aparte
    document.getElementById('orden').addEventListener('change', buscar);

    // Que la tecla Enter no recargue la página
    document.getElementById('filtros').addEventListener('submit', function (evento) {
      evento.preventDefault();
      buscar();
    });

    document.getElementById('btnLimpiar').addEventListener('click', function () {
      document.getElementById('filtros').reset();
      llenarMunicipios();
      buscar();
    });

    iniciar().catch(function (error) {
      alerta(document.getElementById('resultados'), esc(error.message));
    });
  </script>
</body>
</html>
