<!doctype html>
<!--
  #PAGINA_MIS_REGISTROS
  MIS REGISTROS / TODOS LOS REGISTROS
  Tabla para manejar los hospedajes.
  - El registrador ve solo los que él registró.
  - El administrador ve todos y puede aprobar, rechazar, activar,
    desactivar, editar y eliminar.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registros - Hospedajes Antigua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-0" id="titulo">Mis registros</h1>
        <p class="text-muted small mb-0" id="subtitulo"></p>
      </div>
      <a class="btn btn-primary d-none" href="registro.html" id="btnNuevo"><i class="bi bi-plus-lg"></i> Registrar hospedaje</a>
    </div>
    <div id="mensaje"></div>

    <!-- Filtros -->
    <form id="filtros" class="row g-2 mb-3">
      <div class="col-12 col-md-4">
        <input class="form-control" id="q" placeholder="Buscar..." aria-label="Buscar">
      </div>
      <div class="col-6 col-md-3">
        <select class="form-select" id="tipo" aria-label="Tipo"><option value="">Todos los tipos</option></select>
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select" id="revision" aria-label="Revisión">
          <option value="">Toda revisión</option>
          <option value="pendiente">Pendientes</option>
          <option value="aprobado">Aprobados</option>
          <option value="rechazado">Rechazados</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select" id="estado" aria-label="Estado">
          <option value="">Todo estado</option>
          <option value="activo">Activos</option>
          <option value="inactivo">Inactivos</option>
        </select>
      </div>
      <div class="col-12 col-md-1">
        <select class="form-select" id="eliminacion" aria-label="Solicitudes de eliminación" title="Solicitudes de eliminación">
          <option value="">Todos</option>
          <option value="1">Eliminación pedida</option>
        </select>
      </div>
    </form>

    <!-- Tabla -->
    <div class="table-responsive card shadow-sm">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th class="d-none d-md-table-cell">Tipo</th>
            <th class="d-none d-lg-table-cell">Coordenadas</th>
            <th class="d-none d-lg-table-cell">Registrado por</th>
            <th>Revisión</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla">
          <tr><td colspan="8" class="text-muted">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Ventana para escribir por qué se rechaza un registro -->
  <div class="modal fade" id="ventanaRechazo" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="formRechazo">
        <div class="modal-header">
          <h2 class="modal-title h5">Rechazar registro</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="observacion">Observación para el registrador</label>
          <textarea class="form-control" id="observacion" rows="3" required placeholder="Ej.: Las coordenadas no corresponden al hotel."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger">Rechazar</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="py-3 text-center small">Proyecto Programación 2 · Grupo 4 · Hoteles y hospedajes</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script>
    // Entra quien tenga algún permiso de gestión (#PERMISOS)
    const usuario = exigirPermiso(null);
    pintarMenu('mis');

    const mensaje = document.getElementById('mensaje');
    const ventanaRechazo = new bootstrap.Modal(document.getElementById('ventanaRechazo'));
    let idParaRechazar = null;

    // Botones de cada fila: cada uno aparece solo si la cuenta tiene ese permiso (#PERMISOS)
    function botonesDeAcciones(h) {
      const yo = usuarioActual();
      let html = `<a class="btn btn-sm btn-outline-secondary" href="hospedaje.html?id=${h.id}" title="Ver"><i class="bi bi-eye"></i></a>`;

      if (puedeModificar(h)) {
        html += `<a class="btn btn-sm btn-outline-secondary" href="registro.html?id=${h.id}" title="Editar"><i class="bi bi-pencil"></i></a>`;
      }
      // #SOLICITUD_ELIMINACION - Si hay una solicitud pendiente, quien puede eliminar la aprueba o la rechaza
      if (h.eliminacion_solicitada && puedeEliminar(h)) {
        html += `<button class="btn btn-sm btn-danger" title="Aprobar eliminación" onclick="decidirEliminacion(${h.id}, 'aprobar', this)" data-nombre="${esc(h.nombre)}"><i class="bi bi-trash-fill"></i></button>`;
        html += `<button class="btn btn-sm btn-outline-success" title="Rechazar eliminación (se queda)" onclick="decidirEliminacion(${h.id}, 'rechazar', this)"><i class="bi bi-arrow-counterclockwise"></i></button>`;
      } else if (puedeEliminar(h)) {
        html += `<button class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="eliminar(${h.id}, this)" data-nombre="${esc(h.nombre)}"><i class="bi bi-trash"></i></button>`;
      } else if (puedeSolicitarEliminar(h)) {
        html += `<button class="btn btn-sm btn-outline-danger" title="Pedir eliminación" onclick="pedirEliminacion(${h.id}, this)" data-nombre="${esc(h.nombre)}"><i class="bi bi-trash"></i></button>`;
      }

      if (tienePermiso(yo, 'aprobar')) {
        if (h.revision !== 'aprobado') {
          html += `<button class="btn btn-sm btn-success" title="Aprobar" onclick="aprobar(${h.id})"><i class="bi bi-check-lg"></i></button>`;
        }
        if (h.revision !== 'rechazado') {
          html += `<button class="btn btn-sm btn-outline-danger" title="Rechazar" onclick="abrirRechazo(${h.id})"><i class="bi bi-x-lg"></i></button>`;
        }
      }
      if (tienePermiso(yo, 'estado')) {
        if (h.estado === 'activo') {
          html += `<button class="btn btn-sm btn-outline-dark" title="Desactivar" onclick="cambiarEstado(${h.id}, 'inactivo')"><i class="bi bi-eye-slash"></i></button>`;
        } else {
          html += `<button class="btn btn-sm btn-outline-primary" title="Activar" onclick="cambiarEstado(${h.id}, 'activo')"><i class="bi bi-arrow-counterclockwise"></i></button>`;
        }
      }

      return `<div class="btn-group">${html}</div>`;
    }

    // Pide la lista a la API y llena la tabla
    async function cargar() {
      const filtros = new URLSearchParams();
      for (const campo of ['q', 'tipo', 'revision', 'estado', 'eliminacion']) {
        const valor = document.getElementById(campo).value;
        if (valor !== '') filtros.set(campo, valor);
      }

      const tabla = document.getElementById('tabla');
      try {
        const lista = await api('/hospedajes/gestion?' + filtros.toString());

        if (lista.length === 0) {
          tabla.innerHTML = '<tr><td colspan="8" class="text-muted">No hay registros.</td></tr>';
          return;
        }

        let filas = '';
        for (const h of lista) {
          let observacion = '';
          if (h.revision === 'rechazado' && h.observacion) {
            observacion = `<div class="small text-danger">${esc(h.observacion)}</div>`;
          }
          // #SOLICITUD_ELIMINACION - Aviso de que alguien pidió eliminarlo
          if (h.eliminacion_solicitada) {
            observacion += `
              <div class="small mt-1"><span class="badge text-bg-danger"><i class="bi bi-trash"></i> Eliminación pedida</span>
                <span class="text-muted">por ${esc(h.eliminacion_por_nombre || '—')}: ${esc(h.eliminacion_motivo)}</span></div>`;
          }
          let colorEstado = 'text-bg-secondary';
          if (h.estado === 'activo') colorEstado = 'text-bg-primary';

          filas += `
            <tr>
              <td class="small text-nowrap">${esc(h.codigo)}</td>
              <td>${esc(h.nombre)} ${observacion}</td>
              <td class="d-none d-md-table-cell small">${esc(h.tipo)}</td>
              <td class="d-none d-lg-table-cell small">
                <a href="${urlMaps(h.latitud, h.longitud)}" target="_blank">${h.latitud.toFixed(5)}, ${h.longitud.toFixed(5)}</a>
              </td>
              <td class="d-none d-lg-table-cell small">${esc(h.creado_por)}</td>
              <td>${etiquetaRevision(h.revision)}</td>
              <td><span class="badge ${colorEstado}">${h.estado}</span></td>
              <td class="text-end">${botonesDeAcciones(h)}</td>
            </tr>`;
        }
        tabla.innerHTML = filas;
      } catch (error) {
        tabla.innerHTML = `<tr><td colspan="8" class="text-danger">${esc(error.message)}</td></tr>`;
      }
    }

    // ----- Acciones de los botones -----   #APROBAR_RECHAZAR  #ACTIVAR_DESACTIVAR  #ELIMINAR_HOSPEDAJE

    async function aprobar(id) {
      try {
        await api('/hospedajes/' + id + '/revision', { method: 'PATCH', body: { revision: 'aprobado' } });
        cargar();
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
    }

    async function cambiarEstado(id, estado) {
      try {
        await api('/hospedajes/' + id + '/estado', { method: 'PATCH', body: { estado: estado } });
        cargar();
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
    }

    async function eliminar(id, boton) {
      try {
        const eliminado = await eliminarHospedaje(id, boton.dataset.nombre);
        if (eliminado) cargar();
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
    }

    // #SOLICITUD_ELIMINACION - El registrador pide eliminar uno suyo
    async function pedirEliminacion(id, boton) {
      try {
        const enviada = await solicitarEliminacion(id, boton.dataset.nombre);
        if (enviada) cargar();
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
    }

    // El administrador aprueba (se borra) o rechaza (se queda) la solicitud
    async function decidirEliminacion(id, decision, boton) {
      if (decision === 'aprobar' && !confirm('¿Eliminar "' + boton.dataset.nombre + '"? Esta acción no se puede deshacer.')) {
        return;
      }
      try {
        await api('/hospedajes/' + id + '/eliminacion', { method: 'PATCH', body: { decision: decision } });
        alerta(mensaje, decision === 'aprobar' ? 'Hospedaje eliminado.' : 'Solicitud rechazada: el hospedaje se queda.', 'success');
        cargar();
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
    }

    // Rechazar: primero se abre la ventana para escribir la observación
    function abrirRechazo(id) {
      idParaRechazar = id;
      document.getElementById('observacion').value = '';
      ventanaRechazo.show();
    }

    document.getElementById('formRechazo').addEventListener('submit', async function (evento) {
      evento.preventDefault();
      try {
        await api('/hospedajes/' + idParaRechazar + '/revision', {
          method: 'PATCH',
          body: { revision: 'rechazado', observacion: document.getElementById('observacion').value },
        });
        ventanaRechazo.hide();
        cargar();
      } catch (error) {
        alerta(mensaje, esc(error.message));
      }
    });

    // Cuando cambian los filtros, cargamos de nuevo (esperando 300 ms)
    let espera;
    document.getElementById('filtros').addEventListener('input', function () {
      clearTimeout(espera);
      espera = setTimeout(cargar, 300);
    });
    document.getElementById('filtros').addEventListener('submit', function (evento) {
      evento.preventDefault();
      cargar();
    });

    // ----- Al abrir la página -----
    async function iniciar() {
      // Permisos al día (por si el administrador los cambió)
      const yo = await refrescarSesion();

      if (tienePermiso(yo, 'registrar')) {
        document.getElementById('btnNuevo').classList.remove('d-none');
      }
      if (veTodos(yo)) {
        document.getElementById('titulo').textContent = 'Todos los registros';
        document.getElementById('subtitulo').textContent = 'Los hospedajes de todo el grupo. Ves solo los botones de las funciones que tienes permitidas.';
      } else if (tienePermiso(yo, 'propios')) {
        document.getElementById('subtitulo').textContent = 'Puedes editar tus registros cuando quieras. Para eliminar uno, envía una solicitud que aprueba un administrador.';
      } else {
        document.getElementById('subtitulo').textContent = 'Tus registros.';
      }

      // Lista de tipos para el filtro
      let ruta = '/tipos';
      if (tienePermiso(yo, 'tipos')) ruta = '/tipos?todos=1';
      const tipos = await api(ruta);
      for (const t of tipos) {
        document.getElementById('tipo').innerHTML += `<option value="${t.id}">${esc(t.nombre)}</option>`;
      }

      // Filtros que vienen en la dirección (desde las tarjetas de Administración)
      if (parametro('revision')) document.getElementById('revision').value = parametro('revision');
      if (parametro('estado')) document.getElementById('estado').value = parametro('estado');
      if (parametro('eliminacion')) document.getElementById('eliminacion').value = parametro('eliminacion');

      cargar();
    }

    if (usuario) {
      iniciar().catch(function (error) {
        alerta(mensaje, esc(error.message));
      });
    }
  </script>
</body>
</html>
